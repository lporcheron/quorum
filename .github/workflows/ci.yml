name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate templates and CSS
        run: make generate css

      - name: Committed generated artifacts must be current
        run: git diff --exit-code

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
