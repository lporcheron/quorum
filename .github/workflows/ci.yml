name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate templates and CSS
        run: make generate css

      - name: Committed generated artifacts must be current
        run: git diff --exit-code

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quorum
          POSTGRES_PASSWORD: quorum
          POSTGRES_DB: quorum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test against PostgreSQL
        run: make generate && go test ./...
        env:
          TEST_DATABASE_URL: postgres://quorum:quorum@127.0.0.1:5432/quorum_test?sslmode=disable
